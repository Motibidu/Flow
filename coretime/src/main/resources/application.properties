# MySQL 데이터베이스 설정
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# localhost:3306 뒤의 'coretime'은 본인의 DB 스키마 이름으로 맞추세요.
spring.datasource.url=jdbc:mysql://localhost:3306/coretime?useSSL=false&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=1234


# MyBatis 설정 (동일하게 유지)
mybatis.mapper-locations=classpath:mapper/**/*.xml
mybatis.type-handlers-package=com.flow.coretime.elecApproval.enums,com.flow.coretime.board.enums,com.flow.coretime.enums
mybatis.configuration.map-underscore-to-camel-case=true

# HikariCP 설정 (동일하게 유지)
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

spring.application.name=coretime

# 나머지 설정 (Security, Profiles 등 동일)
spring.security.user.name=admin
spring.security.user.password=1234
logging.level.org.springframework.security=DEBUG
spring.profiles.active=local
app.upload.profile-image-dir=C:/DevData/Flow/coretime/src/main/webapp/resources/upload


server.shutdown=immediate


logging.level.org.apache.ibatis=DEBUG
logging.level.com.flow.coretime.elecApproval.mapper: TRACE



